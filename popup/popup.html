<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podil Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <img src="../icons/icon-32.png" alt="Podil Logo" class="logo">
        <div>
          <h1 class="title">Podil Translator</h1>
          <span class="version-badge">v1.2</span>
        </div>
      </div>
    </header>

    <!-- Language Selector Section -->
    <section class="section">
      <label for="targetLangSelect" class="section-label">Target Language</label>
      <p class="section-desc">Choose the language to automatically translate listing descriptions into:</p>
      
      <div class="select-container">
        <select id="targetLangSelect" class="language-select">
          <option value="en">English</option>
          <option value="uk">Ukrainian (Українська)</option>
          <option value="de">German (Deutsch)</option>
          <option value="es">Spanish (Español)</option>
          <option value="fr">French (Français)</option>
          <option value="it">Italian (Italiano)</option>
          <option value="tr">Turkish (Türkçe)</option>
          <option value="nl">Dutch (Nederlands)</option>
          <option value="pt">Portuguese (Português)</option>
          <option value="ru">Russian (Русский)</option>
          <option value="pl">Polish (Polski)</option>
          <option value="cs">Czech (Čeština)</option>
          <option value="sk">Slovak (Slovenčina)</option>
          <option value="hu">Hungarian (Magyar)</option>
          <option value="ro">Romanian (Română)</option>
          <option value="bg">Bulgarian (Български)</option>
          <option value="el">Greek (Ελληνικά)</option>
          <option value="sv">Swedish (Svenska)</option>
          <option value="no">Norwegian (Norsk)</option>
          <option value="da">Danish (Dansk)</option>
          <option value="fi">Finnish (Suomi)</option>
          <option value="lt">Lithuanian (Lietuvių)</option>
          <option value="lv">Latvian (Latviešu)</option>
          <option value="et">Estonian (Eesti)</option>
          <option value="hr">Croatian (Hrvatski)</option>
          <option value="sr">Serbian (Српски)</option>
          <option value="ka">Georgian (ქართული)</option>
          <option value="ar">Arabic (العربية)</option>
          <option value="he">Hebrew (עברית)</option>
          <option value="hi">Hindi (हिन्दी)</option>
          <option value="ja">Japanese (日本語)</option>
          <option value="ko">Korean (한국어)</option>
          <option value="zh-CN">Chinese (Simplified)</option>
          <option value="vi">Vietnamese (Tiếng Việt)</option>
        </select>
      </div>

      <div id="saveNotice" class="save-notice">✓ Language preference saved</div>
    </section>

    <!-- Supported Platforms -->
    <section class="section platforms-section">
      <span class="section-label">Supported Platforms</span>
      <div class="platforms-badges">
        <span class="platform-badge">OLX.pl</span>
        <span class="platform-badge">Otodom.pl</span>
        <span class="platform-badge">Otomoto.pl</span>
      </div>
    </section>

    <!-- Footer / GitHub Contribute -->
    <footer class="footer">
      <a href="https://github.com/AenR/podil-translator" id="githubLink" class="github-btn" target="_blank" rel="noopener noreferrer">
        <svg class="github-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>Contribute on GitHub</span>
      </a>
      <p class="footer-note">Free & Open Source. Star, report issues, or contribute!</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
